<!DOCTYPE html>
<html lang="en">
    <head>
        <title>HTML Color Palette</title>
    </head>

    <body>
        <!-- Titulo -->
        <h1 style="background-color:#0000ff; color:white; border:2px solid black;">HTML Color Palette</h1>

        <!-- Demonstração de cores -->
        <p style="color: tomato;">Named Color</p>
        <p style="color: rgb(226, 118, 64);">RGB Color</p>
        <p style="color: #4242e9;">HEX Color</p>
        <p style="color: hsl(160, 100%, 50%);">HSL Color</p>
        <p style="color: rgba(255, 99, 71, 0.5);">Transparent Color</p>

        <!-- Mensagens -->
        <p style="background-color: rgb(0, 255, 0); color: black; border: 2px solid tomato;">Success: Your operation was completed.</p>
        <p style="background-color: rgb(255, 179, 0); color: black; border: 2px solid yellowgreen;">Warning: Check the information.</p>
        <p style="background-color: rgb(255, 0, 0); color: white; border: 2px solid mediumaquamarine;">Error: Something went wrong.</p>
    </body>
</html>
