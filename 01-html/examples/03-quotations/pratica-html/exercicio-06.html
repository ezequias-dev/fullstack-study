<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <title>Exercicio 6 - Formatacao com significado</title>
</head>

<body>
  <p><strong>Eu tenho que aprender programação.</strong></p>
  <p>Algum <b>texto</b>.</p>
  <p><em>Enciclopédia</em></p>
  <p>Algum <i>texto</i>.</p>
  <p>R$<del>100:00</del> | R$ <ins>50:00</ins></p>
  <p>H<sub>2</sub>O</p>
  <p>10<sup>2</sup></p>
  <p>Lembra de compra meu <mark>celular</mark>.</p>
  <p>Está <small>palavara</small> é pequena.</p>
</body>

</html>
