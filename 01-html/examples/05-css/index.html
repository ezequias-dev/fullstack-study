<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de CSS — Estilos inline, interno e externo</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .internal-style {
            color: darkgreen;
        }
    </style>
</head>

<body>
    <h1>Formas de aplicar CSS</h1>

    <p style="color: darkred;">Este parágrafo usa CSS inline.</p>
    <p class="internal-style">Este parágrafo usa CSS interno.</p>
    <p class="external-style">Este parágrafo usa CSS externo.</p>
</body>

</html>
