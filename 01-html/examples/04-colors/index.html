<!DOCTYPE hmtl>
<html lang="pt-BR">

<head>
    <title>HTML Colors</title>

    <style>
        h1 {
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>

<body>
    <h1 style="background-color: dodgerblue;">Hello World</h1>
    <p style="background-color: tomato;">Lorem...</p>

    <h1 style="border: 2px dotted tomato;">Hello World</h1>
    <h1 style="border: 2px dashed dodgerblue;">Hello World</h1>
    <h1 style="border: 2px solid violet;">Hello World</h1>

    <h1 style="background-color: rgb(255, 99, 71);color: white;">rgb(255, 99, 71)</h1>
    <h1 style="background-color: #ff6347;color: white;">#ff6347</h1>
    <h1 style="background-color: hsl(9, 100%, 64%);color: white;">hsl(9, 100%, 64%)</h1>
    
    <h1 style="background-color: rgba(255, 99, 71, 0.5);color: white;">rgba(255, 99, 71, 0.5)</h1>
    <h1 style="background-color: hsla(9, 100%, 64%, 0.5);color: white;">hsla(9, 100%, 64%, 0.5)</h1>
</body>

</html>
